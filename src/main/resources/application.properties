# ---- Base de datos H2 en archivo (persiste entre ejecuciones) ----
spring.datasource.url=jdbc:h2:file:./data/stockdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
# update: crea las tablas la primera vez y despues las mantiene
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- Consola limpia (sin banner ni logs de arranque) ----
spring.main.banner-mode=off
logging.level.root=WARN
